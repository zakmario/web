{% extends 'base.html' %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-1"><i class="bi bi-person-plus text-primary"></i> Créer un compte patient</h1>
                    <p class="text-muted small mb-4">Les champs marqués d'un <span class="text-danger">*</span> sont obligatoires.</p>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include 'includes/form_fields.html' %}
                        <button type="submit" class="btn btn-primary w-100">Créer mon compte</button>
                    </form>
                    <p class="text-center small mt-3 mb-0">
                        Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
