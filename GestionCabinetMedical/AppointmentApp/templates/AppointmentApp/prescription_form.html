{% extends 'base.html' %}
{% block title %}Ordonnance{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-1"><i class="bi bi-file-earmark-pdf text-primary"></i> Ordonnance</h1>
                    <p class="text-muted mb-4">
                        {{ appointment.patient }} · {{ appointment.appointment_date|date:"d/m/Y H:i" }}
                    </p>
                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}
                        {% include 'includes/form_fields.html' %}
                        <div class="d-flex gap-2">
                            <a href="{% url 'appointment_list' %}" class="btn btn-outline-secondary flex-fill">Retour</a>
                            <button type="submit" class="btn btn-primary flex-fill">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
