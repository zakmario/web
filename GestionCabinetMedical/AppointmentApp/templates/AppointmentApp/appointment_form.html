{% extends 'base.html' %}
{% block title %}Prendre rendez-vous{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4"><i class="bi bi-calendar-plus text-primary"></i> Prendre rendez-vous</h1>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include 'includes/form_fields.html' %}
                        <div class="d-flex gap-2">
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary flex-fill">Annuler</a>
                            <button type="submit" class="btn btn-primary flex-fill">Envoyer la demande</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
